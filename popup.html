<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
  <title>Leftoff</title>
</head>

<body>
  <!-- List view: the default when the popup opens -->
  <section id="listView">
    <header>
      <strong class="app-title">Bookmarks</strong>
      <button type="button" id="add" class="primary small" title="Add a note for the current site">+ Add</button>
    </header>
    <div id="list"></div>
  </section>

  <!-- Editor view: shown after pressing + Add or the edit button on an entry -->
  <section id="editView" class="hidden">
    <header>
      <button type="button" id="back" class="ghost" title="Back to list">← Back</button>
      <button type="button" id="delete" class="ghost danger" title="Delete this note">Delete</button>
    </header>
    <div class="entry">
      <div class="row first">
        <label>Title<input id="f-title" placeholder="Show, film or book" spellcheck="false"></label>
      </div>
      <div class="row">
        <label>Progress<input id="f-episode" placeholder="S2E05 or p. 112" spellcheck="false"></label>
        <label>Time<input id="f-time" placeholder="00:42:10" spellcheck="false"></label>
      </div>
      <div class="row bottom">
        <label>URL<input id="f-url" placeholder="https://…" spellcheck="false"></label>
        <button type="button" id="relink" class="ghost icon" title="Update URL"
          aria-label="Update URL">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-3-6.7"></path>
            <polyline points="21 3 21 9 15 9"></polyline>
          </svg>
        </button>
      </div>
      <div id="confirm" class="confirm hidden" role="alertdialog" aria-label="Confirm delete">
        <div class="confirm-box">
          <div id="confirmText">Delete this note?</div>
          <div class="confirm-actions">
            <button type="button" id="confirmNo" class="ghost">Cancel</button>
            <button type="button" id="confirmYes" class="ghost danger">Delete</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <footer> <span id="status" class="muted" role="status"></span></footer>
  <script src="popup.js"></script>
</body>

</html>
